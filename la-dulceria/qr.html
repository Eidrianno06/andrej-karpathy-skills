<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>La Dulcería · Códigos QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
/* Hoja de códigos para imprimir y recortar: una tarjeta por mesa. */
.wrap{max-width:900px}
.tools{padding-block:24px 8px;display:grid;gap:10px}
.tools h1{font-family:var(--display);font-size:30px;margin:0}
.tools p{margin:0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-block:16px 40px}
.qr{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center;display:grid;gap:8px;justify-items:center;break-inside:avoid}
.qr .logo{color:var(--cocoa);font-size:22px}
.qr .logo span{color:var(--caramel)}
.qr b{font-family:var(--display);font-size:34px;line-height:1}
.qr .code{width:190px;max-width:100%;aspect-ratio:1}
.qr .code svg{width:100%;height:100%;display:block}
.qr p{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.qr a{font-size:11px;color:var(--muted);word-break:break-all}
@media print{
  .tools,.demo{display:none!important}
  body{background:#fff}
  .grid{grid-template-columns:repeat(2,1fr);padding:0}
  .qr{border:1px dashed #bbb}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="tools">
    <h1>Códigos QR de las mesas</h1>
    <p>Cada código abre la carta con su número de mesa. Imprímelos, recórtalos y pon cada uno en su mesa.</p>
    <div class="row">
      <input id="base" aria-label="Dirección de la carta" spellcheck="false">
      <button class="btn" id="imprimir">Imprimir</button>
    </div>
    <p style="font-size:13px">Si publicaste la página en otra dirección, cámbiala arriba y los códigos se actualizan.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
  const mesas = (window.DULCERIA && window.DULCERIA.mesas) || 8;
  const base = document.getElementById('base');
  base.value = new URL('menu.html', location.href).href;
  function pintar(){
    const url = base.value.trim();
    document.getElementById('grid').innerHTML = Array.from({length:mesas}, (_, i) => {
      const link = url + (url.includes('?') ? '&' : '?') + 'mesa=' + (i + 1);
      const q = qrcode(0, 'M'); q.addData(link); q.make();
      return `<div class="qr"><span class="logo">La Dulcer<span>í</span>a</span><b>Mesa ${i + 1}</b>
        <div class="code">${q.createSvgTag({cellSize:4, margin:2, scalable:true})}</div>
        <p>Escanea para ver la carta y pedir</p><a href="${link.replace(/"/g, '&quot;')}">${link.replace(/</g, '&lt;')}</a></div>`;
    }).join('');
  }
  base.addEventListener('input', pintar);
  document.getElementById('imprimir').addEventListener('click', () => window.print());
  pintar();
})();
</script>
</body>
</html>
